services:
  postgres:
    image: postgres:16-alpine
    container_name: rant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rant
      POSTGRES_PASSWORD: rant
      POSTGRES_DB: rant
    ports:
      - "5432:5432"
    volumes:
      - rant-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rant -d rant"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rant-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - rant-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rant-pgdata:
  rant-redisdata:
